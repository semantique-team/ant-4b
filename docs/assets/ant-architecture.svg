<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" width="1000" height="840" role="img"
     aria-labelledby="ant-architecture-title ant-architecture-desc">
  <title id="ant-architecture-title">ANT-4B System One scoring path</title>
  <desc id="ant-architecture-desc">How ANT encodes a state with its question and every candidate through a shared frozen Qwen3.5-4B decoder, scores each candidate, calibrates the distribution, and hands execute or escalate decisions to the application or a System 2 model.</desc>

  <style>
    @media (prefers-color-scheme: dark) {
      .paper { fill: #14171c; }
      .node-mask, .label-mask { fill: #14171c; }
      .label-mask.on-zone { fill: #191d23; }
      .node { fill: #1b1f26; stroke: #e6e8ec; }
      .node.focal { fill: #3a271d; stroke: #e08a5c; }
      .node-title { fill: #e6e8ec; }
      .node-sub, .arrow-label, .eyebrow, .legend-label, .callout { fill: #858e9c; }
      .connector { stroke: #a6aeba; }
      .zone { fill: #191d23; stroke: #2c313a; }
      .tag { stroke: #858e9c; }
      .rule, .legend-key { stroke: #2c313a; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#525b6a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#25537d"/>
    </marker>
  </defs>

  <rect class="paper" x="0" y="0" width="1000" height="840" fill="#f7f7f5"/>

  <text class="eyebrow" x="32" y="40" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        letter-spacing="0.14em">ANT-4B ARCHITECTURE</text>
  <text class="figure-title" x="32" y="76" fill="#22262e" font-size="28"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">System One scoring path</text>
  <line class="rule" x1="32" y1="96" x2="968" y2="96" stroke="#d5d8dd" stroke-width="0.8"/>

  <!-- zones: decision head (shared frozen decoder), inference stack -->
  <rect class="zone" x="224" y="232" width="568" height="256" rx="8"
        fill="#fbfbfa" stroke="#d5d8dd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect class="label-mask on-zone" x="240" y="228" width="252" height="12" rx="2" fill="#fbfbfa"/>
  <text class="node-sub" x="244" y="236" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        letter-spacing="0.14em">DECISION HEAD · SHARED FROZEN DECODER</text>

  <rect class="zone" x="224" y="528" width="568" height="120" rx="8"
