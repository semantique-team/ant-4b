  <rect class="label-mask on-zone" x="240" y="524" width="120" height="12" rx="2" fill="#fbfbfa"/>
  <text class="node-sub" x="244" y="532" fill="#6b7482" font-size="8"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        letter-spacing="0.14em">INFERENCE STACK</text>

