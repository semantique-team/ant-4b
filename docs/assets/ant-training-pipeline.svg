<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 504" width="1120" height="504" role="img"
     aria-labelledby="ant-training-pipeline-title ant-training-pipeline-desc">
  <title id="ant-training-pipeline-title">ANT-4B training pipeline</title>
  <desc id="ant-training-pipeline-desc">How task data becomes decision examples, how the decision head trains on top of the frozen decoder, and how the calibrator and escalation policy are fitted on held-out splits before evaluation and the small head checkpoint is released.</desc>

  <style>
    @media (prefers-color-scheme: dark) {
      .paper { fill: #14171c; }
      .node-mask, .label-mask { fill: #14171c; }
      .label-mask.on-zone { fill: #191d23; }
      .node { fill: #1b1f26; stroke: #e6e8ec; }
      .node.focal { fill: #3a271d; stroke: #e08a5c; }
      .node-title { fill: #e6e8ec; }
      .node-sub, .arrow-label, .eyebrow, .legend-label, .callout { fill: #858e9c; }
      .connector { stroke: #a6aeba; }
      .zone { fill: #191d23; stroke: #2c313a; }
      .tag { stroke: #858e9c; }
      .rule, .legend-key { stroke: #2c313a; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#525b6a"/>
    </marker>
  </defs>

